[project]
name = "ai-security-analyst"
version = "0.1.0"
description = "An explainable SOC copilot with RAG, citations, security log analysis, and evals."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

